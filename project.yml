name: ContextLens
options:
  minimumXcodeGenVersion: 2.46.0
  bundleIdPrefix: com.la3679
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: '1'
packages:
  ContextLensCore:
    path: ContextLensCore
targets:
  ContextLens:
    type: application
    platform: iOS
    sources: [ContextLensApp]
    dependencies:
      - package: ContextLensCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.la3679.ContextLens
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ContextLens
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  ContextLensTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ContextLensTests]
    dependencies:
      - target: ContextLens
      - package: ContextLensCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ContextLensUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ContextLensUITests]
    dependencies:
      - target: ContextLens
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ContextLens:
    build:
      targets:
        ContextLens: all
    test:
      gatherCoverageData: true
      targets:
        - ContextLensTests
        - ContextLensUITests
