[project]
name = "contextlens-gateway"
version = "0.1.0"
description = "Backend-only intelligence gateway for ContextLens"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.8,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
    "pytest-socket>=0.7,<1",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "pip-audit>=2.9,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Asyncio needs local socket pairs on Windows; outbound hosts remain blocked.
addopts = "-q --allow-hosts=127.0.0.1,::1 --allow-unix-socket"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]
