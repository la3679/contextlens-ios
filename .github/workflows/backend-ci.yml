name: Backend CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.12.2'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --python 3.11
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy
      - run: uv run --frozen python -m pytest
      - name: Audit locked runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o /tmp/contextlens-requirements.txt
          uv run --frozen pip-audit --require-hashes -r /tmp/contextlens-requirements.txt
