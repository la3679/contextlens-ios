name: Core CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Record actual Apple toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test pure Swift package with warnings as errors
        working-directory: ContextLensCore
        run: swift test -Xswiftc -warnings-as-errors
